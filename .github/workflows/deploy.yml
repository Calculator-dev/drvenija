name: Deploy to Cloudflare

# Deploys the webshop, the CRM and the keep-alive Worker to Cloudflare after every merge to
# master. The API deploys itself on Render. Nothing runs until the repository variable
# CLOUDFLARE_DEPLOY is set to "true" (see DEPLOY.md).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy webshop
        working-directory: apps/storefront
        env:
          # The server also reads NEXT_PUBLIC_API_URL when API_URL is not set.
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_CONTACT_PHONE: ${{ vars.CONTACT_PHONE }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: pnpm cf:deploy

      - name: Deploy CRM
        working-directory: apps/crm
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm cf:deploy

      - name: Deploy keep-alive Worker
        run: pnpm deploy:keepalive --var API_URL:${{ vars.API_URL }}
